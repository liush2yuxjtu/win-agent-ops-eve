<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f4f2ed" stroke="#f4f2ed"/><text x="34" y="44" font-size="24" fill="#214f42" font-weight="700">W/  业务运行简报</text><text x="845" y="42" font-size="16" fill="#626d68" font-weight="400">领导版设计稿 · 演示情景，非真实事故</text><rect x="24" y="80" width="215" height="612" rx="10" fill="#fefdf9" stroke="#d5dbd4"/><text x="44" y="119" font-size="18" fill="#214f42" font-weight="650">需要关注</text><rect x="38" y="145" width="187" height="114" rx="7" fill="#f7e7e1" stroke="#f7e7e1"/><text x="51" y="177" font-size="20" fill="#202a28" font-weight="650">客户登录异常</text><text x="51" y="208" font-size="17" fill="#9d382f" font-weight="600">优先处理</text><text x="51" y="236" font-size="15" fill="#626d68" font-weight="400">业务影响待确认</text><text x="53" y="296" font-size="18" fill="#626d68" font-weight="400">业务影响</text><text x="53" y="349" font-size="18" fill="#626d68" font-weight="400">原因判断</text><text x="53" y="402" font-size="18" fill="#626d68" font-weight="400">独立方案比较</text><rect x="38" y="427" width="187" height="43" rx="5" fill="#e8eee7" stroke="#e8eee7"/><text x="53" y="455" font-size="18" fill="#214f42" font-weight="650">形成建议</text><text x="53" y="508" font-size="18" fill="#626d68" font-weight="400">决策留痕</text><text x="43" y="637" font-size="15" fill="#626d68" font-weight="400">建议不等于执行授权</text><text x="43" y="665" font-size="15" fill="#626d68" font-weight="400">技术细节按需查看</text><text x="273" y="119" font-size="31" fill="#202a28" font-weight="650">建议优先评估：恢复上一稳定版本</text><text x="275" y="151" font-size="17" fill="#626d68" font-weight="400">本例推荐有前提，不代表现在就可以执行。</text><rect x="272" y="183" width="622" height="304" rx="12" fill="#fefdf9" stroke="#d5dbd4"/><text x="298" y="224" font-size="18" fill="#626d68" font-weight="400">预期收益</text><text x="298" y="264" font-size="27" fill="#214f42" font-weight="650">尽快回到已验证的业务状态</text><text x="298" y="306" font-size="20" fill="#202a28" font-weight="400">本例假设上一稳定版本仍可用。</text><text x="298" y="340" font-size="20" fill="#202a28" font-weight="400">如果数据兼容，恢复旧版本可能比继续定位更快。</text><text x="298" y="374" font-size="20" fill="#202a28" font-weight="400">如果兼容性不成立，这条路线就不适用。</text><text x="298" y="446" font-size="17" fill="#626d68" font-weight="400">独立目标：恢复线上服务，不是定位根因的一个步骤。</text><rect x="916" y="183" width="334" height="304" rx="12" fill="#e8eee7" stroke="#d5dbd4"/><text x="940" y="225" font-size="23" fill="#214f42" font-weight="650">需要领导确认的取舍</text><text x="940" y="273" font-size="19" fill="#202a28" font-weight="400">接受近期新功能暂时下线</text><text x="940" y="315" font-size="19" fill="#202a28" font-weight="400">接受评估后的服务切换窗口</text><text x="940" y="357" font-size="19" fill="#202a28" font-weight="400">明确技术与业务协调人</text><text x="940" y="439" font-size="17" fill="#626d68" font-weight="400">授权范围与时间另行确认</text><rect x="272" y="511" width="978" height="168" rx="12" fill="#fefdf9" stroke="#d5dbd4"/><text x="298" y="549" font-size="22" fill="#202a28" font-weight="650">怎样判断这条方案有效？</text><text x="298" y="586" font-size="19" fill="#202a28" font-weight="400">客户能登录并完成下单；客服确认关键业务可继续。</text><text x="298" y="617" font-size="19" fill="#202a28" font-weight="400">不能只凭技术检查通过，就宣布业务已经恢复。</text><rect x="1003" y="617" width="220" height="44" rx="6" fill="#214f42" stroke="#214f42"/><text x="1021" y="645" font-size="17" fill="#ffffff" font-weight="600">形成待审批建议</text><path d="M1171 640 l0 30 8 -8 8 17 8 -4 -8 -16 12 -1 Z" fill="#202a28" stroke="white" stroke-width="2"/></g></svg>