<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f4f2ed" stroke="#f4f2ed"/><text x="34" y="44" font-size="24" fill="#214f42" font-weight="700">W/  业务运行简报</text><text x="845" y="42" font-size="16" fill="#626d68" font-weight="400">领导版设计稿 · 演示情景，非真实事故</text><rect x="24" y="80" width="215" height="612" rx="10" fill="#fefdf9" stroke="#d5dbd4"/><text x="44" y="119" font-size="18" fill="#214f42" font-weight="650">需要关注</text><rect x="38" y="145" width="187" height="114" rx="7" fill="#f7e7e1" stroke="#f7e7e1"/><text x="51" y="177" font-size="20" fill="#202a28" font-weight="650">客户登录异常</text><text x="51" y="208" font-size="17" fill="#9d382f" font-weight="600">优先处理</text><text x="51" y="236" font-size="15" fill="#626d68" font-weight="400">业务影响待确认</text><text x="53" y="296" font-size="18" fill="#626d68" font-weight="400">业务影响</text><text x="53" y="349" font-size="18" fill="#626d68" font-weight="400">原因判断</text><text x="53" y="402" font-size="18" fill="#626d68" font-weight="400">独立方案比较</text><text x="53" y="455" font-size="18" fill="#626d68" font-weight="400">形成建议</text><rect x="38" y="480" width="187" height="43" rx="5" fill="#e8eee7" stroke="#e8eee7"/><text x="53" y="508" font-size="18" fill="#214f42" font-weight="650">决策留痕</text><text x="43" y="637" font-size="15" fill="#626d68" font-weight="400">建议不等于执行授权</text><text x="43" y="665" font-size="15" fill="#626d68" font-weight="400">技术细节按需查看</text><text x="273" y="119" font-size="31" fill="#202a28" font-weight="650">决定可追溯，执行另有授权</text><text x="275" y="151" font-size="17" fill="#626d68" font-weight="400">记住为什么这样选，也记住后来有没有用。</text><rect x="272" y="182" width="978" height="129" rx="12" fill="#e8eee7" stroke="#d5dbd4"/><text x="298" y="225" font-size="28" fill="#214f42" font-weight="650">已形成建议：恢复上一稳定版本</text><text x="298" y="269" font-size="19" fill="#626d68" font-weight="400">本地演示状态 · 尚未批准执行 · 未修改任何真实系统</text><rect x="272" y="334" width="978" height="263" rx="12" fill="#fefdf9" stroke="#d5dbd4"/><text x="298" y="374" font-size="18" fill="#626d68" font-weight="400">选择理由</text><text x="440" y="374" font-size="20" fill="#202a28" font-weight="400">优先恢复客户业务，同时保留本次故障证据。</text><text x="298" y="431" font-size="18" fill="#626d68" font-weight="400">执行前提</text><text x="440" y="431" font-size="20" fill="#202a28" font-weight="400">数据兼容、切换窗口和协调人仍需确认。</text><text x="298" y="488" font-size="18" fill="#626d68" font-weight="400">处理结果</text><text x="440" y="488" font-size="20" fill="#202a28" font-weight="400">尚未执行，因此不能标记为“已解决”。</text><text x="298" y="545" font-size="18" fill="#626d68" font-weight="400">历史保留</text><text x="440" y="545" font-size="20" fill="#202a28" font-weight="400">原始问题、原因判断、备选方案和后续反馈分别留存。</text><text x="292" y="635" font-size="20" fill="#202a28" font-weight="600">下次遇到相似问题，可以参考真正有效的历史方案。</text><rect x="1011" y="641" width="216" height="44" rx="6" fill="#fefdf9" stroke="#214f42"/><text x="1029" y="669" font-size="17" fill="#214f42" font-weight="600">查看决策记录</text></g></svg>