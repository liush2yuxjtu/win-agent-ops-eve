<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f4f2ed" stroke="#f4f2ed"/><text x="34" y="44" font-size="24" fill="#214f42" font-weight="700">W/  业务运行简报</text><text x="845" y="42" font-size="16" fill="#626d68" font-weight="400">领导版设计稿 · 演示情景，非真实事故</text><rect x="24" y="80" width="215" height="612" rx="10" fill="#fefdf9" stroke="#d5dbd4"/><text x="44" y="119" font-size="18" fill="#214f42" font-weight="650">需要关注</text><rect x="38" y="145" width="187" height="114" rx="7" fill="#f7e7e1" stroke="#f7e7e1"/><text x="51" y="177" font-size="20" fill="#202a28" font-weight="650">客户登录异常</text><text x="51" y="208" font-size="17" fill="#9d382f" font-weight="600">优先处理</text><text x="51" y="236" font-size="15" fill="#626d68" font-weight="400">业务影响待确认</text><rect x="38" y="268" width="187" height="43" rx="5" fill="#e8eee7" stroke="#e8eee7"/><text x="53" y="296" font-size="18" fill="#214f42" font-weight="650">业务影响</text><text x="53" y="349" font-size="18" fill="#626d68" font-weight="400">原因判断</text><text x="53" y="402" font-size="18" fill="#626d68" font-weight="400">独立方案比较</text><text x="53" y="455" font-size="18" fill="#626d68" font-weight="400">形成建议</text><text x="53" y="508" font-size="18" fill="#626d68" font-weight="400">决策留痕</text><text x="43" y="637" font-size="15" fill="#626d68" font-weight="400">建议不等于执行授权</text><text x="43" y="665" font-size="15" fill="#626d68" font-weight="400">技术细节按需查看</text><text x="273" y="119" font-size="31" fill="#202a28" font-weight="650">先看业务是否受阻</text><text x="275" y="151" font-size="17" fill="#626d68" font-weight="400">一句话看清问题，不用先读日志。</text><rect x="272" y="181" width="978" height="120" rx="12" fill="#fefdf9" stroke="#d5dbd4"/><text x="296" y="219" font-size="27" fill="#202a28" font-weight="650">客户暂时无法登录，在线下单可能受阻。</text><text x="296" y="253" font-size="19" fill="#626d68" font-weight="400">本例发生在一次系统升级后；是否影响全部客户，仍需核实。</text><rect x="272" y="323" width="314" height="177" rx="12" fill="#fefdf9" stroke="#d5dbd4"/><text x="293" y="359" font-size="17" fill="#626d68" font-weight="400">业务影响</text><text x="293" y="404" font-size="23" fill="#202a28" font-weight="600">客户自助服务受阻</text><text x="293" y="452" font-size="17" fill="#626d68" font-weight="400">订单损失尚未确认</text><rect x="604" y="323" width="314" height="177" rx="12" fill="#fefdf9" stroke="#d5dbd4"/><text x="625" y="359" font-size="17" fill="#626d68" font-weight="400">处理优先级</text><text x="625" y="404" font-size="23" fill="#202a28" font-weight="600">建议优先处理</text><text x="625" y="452" font-size="17" fill="#626d68" font-weight="400">先恢复业务，再追查原因</text><rect x="936" y="323" width="314" height="177" rx="12" fill="#fefdf9" stroke="#d5dbd4"/><text x="957" y="359" font-size="17" fill="#626d68" font-weight="400">负责人</text><text x="957" y="404" font-size="23" fill="#202a28" font-weight="600">技术与客服协同</text><text x="957" y="452" font-size="17" fill="#626d68" font-weight="400">不无依据归责个人</text><rect x="272" y="522" width="978" height="150" rx="12" fill="#e8eee7" stroke="#d5dbd4"/><text x="296" y="559" font-size="23" fill="#214f42" font-weight="650">现在需要决定什么？</text><text x="296" y="594" font-size="20" fill="#202a28" font-weight="400">在“恢复系统”和“保障紧急业务”之间，选择一条处理路线。</text><rect x="1020" y="606" width="204" height="44" rx="6" fill="#214f42" stroke="#214f42"/><text x="1038" y="634" font-size="17" fill="#ffffff" font-weight="600">查看判断与方案</text><path d="M1170 631 l0 30 8 -8 8 17 8 -4 -8 -16 12 -1 Z" fill="#202a28" stroke="white" stroke-width="2"/></g></svg>