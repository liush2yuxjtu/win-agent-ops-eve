<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f4f2ed" stroke="#f4f2ed"/><text x="34" y="44" font-size="24" fill="#214f42" font-weight="700">W/  业务运行简报</text><text x="845" y="42" font-size="16" fill="#626d68" font-weight="400">领导版设计稿 · 演示情景，非真实事故</text><rect x="24" y="80" width="215" height="612" rx="10" fill="#fefdf9" stroke="#d5dbd4"/><text x="44" y="119" font-size="18" fill="#214f42" font-weight="650">需要关注</text><rect x="38" y="145" width="187" height="114" rx="7" fill="#f7e7e1" stroke="#f7e7e1"/><text x="51" y="177" font-size="20" fill="#202a28" font-weight="650">客户登录异常</text><text x="51" y="208" font-size="17" fill="#9d382f" font-weight="600">优先处理</text><text x="51" y="236" font-size="15" fill="#626d68" font-weight="400">业务影响待确认</text><text x="53" y="296" font-size="18" fill="#626d68" font-weight="400">业务影响</text><rect x="38" y="321" width="187" height="43" rx="5" fill="#e8eee7" stroke="#e8eee7"/><text x="53" y="349" font-size="18" fill="#214f42" font-weight="650">原因判断</text><text x="53" y="402" font-size="18" fill="#626d68" font-weight="400">独立方案比较</text><text x="53" y="455" font-size="18" fill="#626d68" font-weight="400">形成建议</text><text x="53" y="508" font-size="18" fill="#626d68" font-weight="400">决策留痕</text><text x="43" y="637" font-size="15" fill="#626d68" font-weight="400">建议不等于执行授权</text><text x="43" y="665" font-size="15" fill="#626d68" font-weight="400">技术细节按需查看</text><text x="273" y="119" font-size="31" fill="#202a28" font-weight="650">发生了什么，为什么这么判断</text><text x="275" y="151" font-size="17" fill="#626d68" font-weight="400">把事实、推测和未知分开，避免把猜测当结论。</text><rect x="272" y="184" width="978" height="144" rx="12" fill="#fefdf9" stroke="#d5dbd4"/><text x="296" y="222" font-size="22" fill="#214f42" font-weight="650">已经确认</text><text x="296" y="263" font-size="20" fill="#202a28" font-weight="400">演示情景中，客户登录失败，故障出现在升级之后。</text><text x="296" y="295" font-size="20" fill="#202a28" font-weight="400">当前不能据此认定升级就是故障原因。</text><rect x="272" y="344" width="978" height="144" rx="12" fill="#fefdf9" stroke="#d5dbd4"/><text x="296" y="382" font-size="22" fill="#8b5a16" font-weight="650">倾向判断</text><text x="296" y="423" font-size="20" fill="#202a28" font-weight="400">可能与此次变更有关，建议优先核对变更影响。</text><text x="296" y="455" font-size="20" fill="#202a28" font-weight="400">现有信息还不足以确认具体原因或责任归属。</text><rect x="272" y="504" width="978" height="144" rx="12" fill="#fefdf9" stroke="#d5dbd4"/><text x="296" y="542" font-size="22" fill="#626d68" font-weight="650">仍需核实</text><text x="296" y="583" font-size="20" fill="#202a28" font-weight="400">哪些客户受影响、是否有订单积压，以及上一版本的数据兼容性。</text><text x="296" y="615" font-size="20" fill="#202a28" font-weight="400">这些信息将影响方案能否执行，不能用“页面能打开”代替业务恢复。</text></g></svg>