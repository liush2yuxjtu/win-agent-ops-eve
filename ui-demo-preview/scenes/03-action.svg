<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f4f2ed" stroke="#f4f2ed"/><text x="34" y="44" font-size="24" fill="#214f42" font-weight="700">W/  业务运行简报</text><text x="845" y="42" font-size="16" fill="#626d68" font-weight="400">领导版设计稿 · 演示情景，非真实事故</text><rect x="24" y="80" width="215" height="612" rx="10" fill="#fefdf9" stroke="#d5dbd4"/><text x="44" y="119" font-size="18" fill="#214f42" font-weight="650">需要关注</text><rect x="38" y="145" width="187" height="114" rx="7" fill="#f7e7e1" stroke="#f7e7e1"/><text x="51" y="177" font-size="20" fill="#202a28" font-weight="650">客户登录异常</text><text x="51" y="208" font-size="17" fill="#9d382f" font-weight="600">优先处理</text><text x="51" y="236" font-size="15" fill="#626d68" font-weight="400">业务影响待确认</text><text x="53" y="296" font-size="18" fill="#626d68" font-weight="400">业务影响</text><text x="53" y="349" font-size="18" fill="#626d68" font-weight="400">原因判断</text><rect x="38" y="374" width="187" height="43" rx="5" fill="#e8eee7" stroke="#e8eee7"/><text x="53" y="402" font-size="18" fill="#214f42" font-weight="650">独立方案比较</text><text x="53" y="455" font-size="18" fill="#626d68" font-weight="400">形成建议</text><text x="53" y="508" font-size="18" fill="#626d68" font-weight="400">决策留痕</text><text x="43" y="637" font-size="15" fill="#626d68" font-weight="400">建议不等于执行授权</text><text x="43" y="665" font-size="15" fill="#626d68" font-weight="400">技术细节按需查看</text><text x="273" y="119" font-size="31" fill="#202a28" font-weight="650">五种备选路线，选一条合适的</text><text x="275" y="151" font-size="17" fill="#626d68" font-weight="400">这是彼此独立的选择，不是必须依次完成的五个步骤。</text><rect x="272" y="181" width="978" height="413" rx="12" fill="#fefdf9" stroke="#d5dbd4"/><text x="294" y="218" font-size="17" fill="#626d68" font-weight="600">可独立选择的方案</text><text x="516" y="218" font-size="17" fill="#626d68" font-weight="600">能解决什么</text><text x="806" y="218" font-size="17" fill="#626d68" font-weight="600">适用前提</text><text x="1002" y="218" font-size="17" fill="#626d68" font-weight="600">主要代价</text><text x="295" y="276" font-size="20" fill="#214f42" font-weight="700">A</text><text x="330" y="276" font-size="19" fill="#202a28" font-weight="600">修复当前服务</text><text x="516" y="276" font-size="17" fill="#202a28" font-weight="400">保留现有功能，修复具体故障</text><text x="806" y="276" font-size="16" fill="#626d68" font-weight="400">原因仍未确认</text><text x="1002" y="276" font-size="16" fill="#626d68" font-weight="400">恢复时间可能较长</text><rect x="282" y="308" width="958" height="63" rx="5" fill="#e8eee7" stroke="#e8eee7"/><text x="295" y="344" font-size="20" fill="#214f42" font-weight="700">B</text><text x="330" y="344" font-size="19" fill="#202a28" font-weight="600">恢复上一稳定版本</text><text x="516" y="344" font-size="17" fill="#202a28" font-weight="400">回到已验证的可用状态</text><text x="806" y="344" font-size="16" fill="#626d68" font-weight="400">需确认数据兼容</text><text x="1002" y="344" font-size="16" fill="#626d68" font-weight="400">近期新功能暂不可用</text><text x="295" y="412" font-size="20" fill="#214f42" font-weight="700">C</text><text x="330" y="412" font-size="19" fill="#202a28" font-weight="600">切换备用服务</text><text x="516" y="412" font-size="17" fill="#202a28" font-weight="400">绕开故障，恢复线上服务</text><text x="806" y="412" font-size="16" fill="#626d68" font-weight="400">需有可用备用服务</text><text x="1002" y="412" font-size="16" fill="#626d68" font-weight="400">同步与切换有风险</text><text x="295" y="480" font-size="20" fill="#214f42" font-weight="700">D</text><text x="330" y="480" font-size="19" fill="#202a28" font-weight="600">临时改为人工受理</text><text x="516" y="480" font-size="17" fill="#202a28" font-weight="400">先保障紧急订单继续处理</text><text x="806" y="480" font-size="16" fill="#626d68" font-weight="400">需安排客服与运营</text><text x="1002" y="480" font-size="16" fill="#626d68" font-weight="400">增加人力，系统仍需修复</text><text x="295" y="548" font-size="20" fill="#214f42" font-weight="700">E</text><text x="330" y="548" font-size="19" fill="#202a28" font-weight="600">隔离重建后替换</text><text x="516" y="548" font-size="17" fill="#202a28" font-weight="400">解决复杂环境问题后替换</text><text x="806" y="548" font-size="16" fill="#626d68" font-weight="400">需独立环境与验收</text><text x="1002" y="548" font-size="16" fill="#626d68" font-weight="400">准备周期通常更长</text><text x="291" y="625" font-size="18" fill="#626d68" font-weight="400">时间、费用和人力均待责任团队评估，不编造“几分钟恢复”或成功率。</text><rect x="964" y="642" width="274" height="44" rx="6" fill="#214f42" stroke="#214f42"/><text x="982" y="670" font-size="17" fill="#ffffff" font-weight="600">优先评估方案 B</text><path d="M1180 661 l0 30 8 -8 8 17 8 -4 -8 -16 12 -1 Z" fill="#202a28" stroke="white" stroke-width="2"/></g></svg>